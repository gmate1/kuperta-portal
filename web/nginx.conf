# Két oldal egy nginx-ben, a Host fejléc alapján:
#   kuperta.hu (és bármi más)  → nyilvános weboldal, csak a /api/public/ végpontokkal
#   portal.*                   → belső portál (React SPA) a teljes API-val
#
# Cloudflare Tunnel mögött a valódi látogatói IP a CF-Connecting-IP fejlécben jön.
# Csak a belső Docker hálózatról (a cloudflared konténertől) fogadjuk el.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server_tokens off;

# A cloudflared HTTPS-ként jelzi a kérést (X-Forwarded-Proto: https) – ezt adjuk tovább
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
client_max_body_size 1m;

upstream api_backend {
    server api:4000;
}

# ─── Nyilvános weboldal ───────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name kuperta.hu www.kuperta.hu localhost _;
    root /usr/share/nginx/site;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Csak ez a három végpont érhető el innen – a portál API-ja nem
    location = /api/public/inquiries { proxy_pass http://api_backend; include /etc/nginx/proxy_common.conf; }
    location = /api/public/services  { proxy_pass http://api_backend; include /etc/nginx/proxy_common.conf; }
    location = /api/public/contact   { proxy_pass http://api_backend; include /etc/nginx/proxy_common.conf; }
    location /api/ { return 404; }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML/CSS/JS/képek: a böngésző minden betöltésnél rákérdez, változott-e (ETag) –
    # frissítés után azonnal az új verzió látszik. (Az `expires` nem add_header,
    # így nem írja felül a fenti biztonsági fejléceket.)
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}

# ─── Belső portál ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ~^portal\.;
    root /usr/share/nginx/portal;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://api_backend;
        include /etc/nginx/proxy_common.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA: minden ismeretlen útvonal az index.html-re
    location / {
        try_files $uri /index.html;
    }
}
