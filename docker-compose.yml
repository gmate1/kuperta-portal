# Teljes rendszer egy paranccsal: docker compose up -d --build
# A HTTPS-t éles környezetben egy elé tett reverse proxy (pl. Caddy) adja, lásd README.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finportal
      POSTGRES_USER: finportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Állítsd be a .env-ben}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finportal"]
      interval: 5s
      retries: 10
    # Nincs kiengedve portja kifelé – csak a belső hálózaton érhető el

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://finportal:${POSTGRES_PASSWORD}@db:5432/finportal
      JWT_SECRET: ${JWT_SECRET:?Állítsd be a .env-ben}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Állítsd be a .env-ben}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  web:
    build: ./client
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
