# Indítás:            docker compose up -d --build
# Tunnellel együtt:   docker compose --profile tunnel up -d --build
#
# Helyben:  http://localhost:8080         → weboldal
#           http://portal.localhost:8080  → portál
# Tunnellel: https://kuperta.hu és https://portal.kuperta.hu (lásd TUNNEL.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finportal
      POSTGRES_USER: finportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Állítsd be a .env-ben}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finportal"]
      interval: 5s
      retries: 10
    # Nincs kiengedve portja kifelé – csak a belső hálózaton érhető el

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://finportal:${POSTGRES_PASSWORD}@db:5432/finportal
      JWT_SECRET: ${JWT_SECRET:?Állítsd be a .env-ben}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Állítsd be a .env-ben}
      CORS_ORIGIN: ${PORTAL_URL:-https://portal.kuperta.hu}
      COOKIE_SECURE: auto
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@kuperta.hu}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      # Csak a saját gépről érhető el; kívülről kizárólag a tunnelen át
      - "127.0.0.1:8080:80"

  # Cloudflare Tunnel: kimenő kapcsolatot nyit a Cloudflare felé,
  # így nem kell portot nyitni a routeren. Csak a --profile tunnel indítja.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    depends_on: [web]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
